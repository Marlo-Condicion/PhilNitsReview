ons."}, {"id": "2024A-Q69", "source": "2024 Autumn", "questionNumber": 69, "question": "Among the phases of the PDCA cycle in corporate business operations, which of the\n     following measures and evaluates the status of operations on the basis of KPI?\n\n   a) P                   b) D                   c) C                       d) A", "choices": {}, "answer": "c", "domain": "Strategy", "topic": "Strategy & Business", "difficulty": "Standard", "official": true, "usable": false, "explanation": "Official answer key: C. Use Learn/Review mode to study the underlying concept; detailed generated explanations are intentionally not presented as official ITPEC explanations."}, {"id": "2024A-Q70", "source": "2024 Autumn", "questionNumber": 70, "question": "Data of the defects and faults of products, complaints from customers, etc. are categorized\n     according to their cause and situation. Which of the following represents the number of\n     data in each category in descending order on a bar graph and the cumulative total on a line\n     graph?\n\n   a) Control chart                                                              b) Tree diagram\n   c) Pareto chart                                                               d) Matrix chart", "choices": {}, "answer": "c", "domain": "Technology", "topic": "AI & Data", "difficulty": "Standard", "official": true, "usable": false, "explanation": "Official answer key: C. Use Learn/Review mode to study the underlying concept; detailed generated explanations are intentionally not presented as official ITPEC explanations."}, {"id": "2024A-Q71", "source": "2024 Autumn", "questionNumber": 71, "question": "When the purchase and sales of a product in April are as in the table below, what is the\n     inventory value in yen for the product at the end of April according to the moving\n     average method? The moving average method calculates the average unit price of\n     products in the inventory each time a purchase is made, and use le on its popular website as a general article that favorably\n          reviews a certain product without indicating that the article is an advertisement.\n       C: A bag with a design inspired by France was manufactured domestically and was put\n          on sale with a tag featuring a photograph of Paris and the French flag, but without\n          noting the country of production.\n\n   a) A, B               b) A, B, C             c) A, C                    d) B, C", "choices": {}, "answer": "d", "domain": "Technology", "topic": "AI & Data", "difficulty": "Standard", "official": true, "usable": false, "explanation": "Official answer key: D. Use Learn/Review mode to study the underlying concept; detailed generated explanations are intentionally not presented as official ITPEC explanations."}, {"id": "2024A-Q77", "source": "2024 Autumn", "questionNumber": 77, "question": "Which of the following is appropriate as an expected advantage of the adoption of ISO\n     9001 by companies?", "choices": {"a": "The companies’ trade procedures will be standardized, leading to increased efficiency and the avoidance of non-tariff barriers.", "b": "Technical specifications will be standardized in the industry, and increase in product quality and expansion of markets will move forward.", "c": "Methods for handling information assets will be standardized and the quality of information security will increase.", "d": "Business operations concerning quality management will be standardized, and the quality and efficiency of management will increase."}, "answer": "d", "domain": "Strategy", "topic": "Strategy & Business", "difficulty": "Standard", "official": true, "usable": true, "explanation": "Official answer key: D. Use Learn/Review mode to study the underlying concept; detailed generated explanations are intentionally not presented as official ITPEC explanations."}, {"id": "2024A-Q78", "source": "2024 Autumn", "questionNumber": 78, "question": "Which of the following is an organiza eclares a procedure and its argument(s) arg1, ... . ○ ret-type: function(type: arg1, ...) Declares a function, its argument(s) arg1, ... , and type of return value ret-type. type: var1, ...                       Declares variables var1, ... and arrays array1, ... by type []: array1, ...                  data type such as integer, real, and string. /* comment */                         Describes a comment between /* and */. // comment                            Describes a comment after // till end of line. variable ← expression                 Assigns the value of the expression to the variable. procedure(arg1, ...)                  Calls a procedure by passing arguments arg1, ... . function(arg1, ...)                   Calls a function by passing arguments arg1, ... , and receiving the return value. output arg1, ...                      Outputs values of arg1, ... to a printing device. return ret-val                        Finishes a function by passing back a return value ret-val. if (condition-i)                      Indicates the selection process. process-i               *1          *1 If condition-i is true, then execute process-i. elseif (condition-ei)                       Otherwise, proceed to the next elseif or process-ei              *2          else. else                                  *2 If condition-ei is true, then execute process-ei. process-e               *3                Otherwise, proceed to the next elseif or endif                                 else. *3 If all conditions are false, execute process-e. Note: *2 and *3 can be omitted. Note: *2 may exist twice or more. for (sequence)                        Indicates the “for” iteration process. process                             In the order specified in the sequence, execute the endfor                                process repeatedly. while (condition)                     Indicates the “while” iteration process. process                             While the condition is true, execute the process endwhile                              repeatedly. do                                    Indicates the “do - while” iteration process. process                             Execute the process once, and then while the while (condition)                     condition is true, execute the process repeatedly. - i - Pseudo programming language notations (continued) [Operators and their precedence] Type of             Operators                                  Precedence Note operator Expression          ( ) (1)                                        High        (1) accessing member or method Unary operator      +,    −,       not (2)                                     (2) logical negation Binary operator     ×,    ÷,       mod (3)                                     (3) remainder +,    − >,    <,       ≥,       ≤,   =, ≠ and (4)                                                    (4) logical product or (5)                                         Low         (5) logical sum [Boolean-type constants] true, false [Array reference] 1-dimensional array               2-dimensional array Array declaration type []: name ...                       type [,]: name ... Example           integer []: a1                          integer [,]: a2 1    2        3    4   5                  1     2     3 1    3        5    7   9             1   11     12   13 2   14     15   16 3   17     18   19 Data reference       Data 7 is referred                   Data 16 is referred to by a1[4]                          to by a2[2,3] Notation of array    {1, 3, 5, 7, 9}                      {{11, 12, 13}, contents                                                   {14, 15, 16}, {17, 18, 19}} Notes:  The indexes of arrays start at 1, unless otherwise noted. Areas outside of the arrays must not be referenced in the program. - ii - Spreadsheet Software Functions and Terminology The following shows the basic functions and terminology of spreadsheet software. If functions other than those shown here are used, such as worksheet saving, reading, printing, border drawing, and chart creation, these are shown in the question. 1. Worksheets (1) A work area in the form of grids comprising rows and columns is called a worksheet. The size of a worksheet is 256 columns and 10,000 rows. (2)Respective positions of columns and rows on a worksheet are represented by row and column numbers. For the column numbers, the leftmost number is A, and they are represented as A, B, ..., Z, AA, AB, ..., AZ, BA, BB, ..., BZ, ..., IU, ...IV. For the row numbers, the topmost number is 1 , and they are represented as 1, 2, ..., 10000 . (3) Multiple worksheets can be used. In this case, a unique name is to be given to each worksheet so that they can be distinguished from the other worksheets. 2. Cells and cell ranges (1) Each grid that makes up a worksheet is called a cell. Its position is represented by the column and row numbers, and this is called a cell address. [Example] The cell address of the cell at column A row 1 is represented as A1 . (2) When a group of all cells in a rectangular area in a worksheet are to be handled together, the group is represented by using the cell addresses of the cells at top left and bottom right in the rectangle and “:” as “top left cell address:bottom right cell address”. This is called a cell range. [Example] A cell range whose addresses at top left is A1 and bottom right is B3 is represented as “A1:B3” . (3) If a cell address or a cell range in another worksheet is to be specified, the address is represented by using the worksheet name and “ ! ” as “worksheet name!cell address” and the range is represented as “worksheet name!cell range”. [Example] If cells B5 to G10 in worksheet “Sheet1” are to be specified from another worksheet, it is represented as “Sheet1!B5:G10” . 3. Values and expressions (1) A cell has a value, and the value can be referenced by the cell address. A cell value is a numerical value, character string, logical value, or null value. (2) A character string is enclosed in single quotation marks “ ’ ”. [Example] The character strings “ A ” and “ BC ” are expressed as ’A’ and ’BC’, respectively. (3) A logical value is represented as true or false. (4) A null value is represented as null, and a cell with a null value is called a blank cell. The initial state of a cell is blank. - iii - (5) An expression can be entered into a cell. The cell has the value of evaluated result of the expression. (6) An expression is composed of constants, cell addresses, operators, parentheses, and functions. A constant is represented as a numerical value, character string, logical value, or null value. A cell address in an expression references a value of the cell at that address. (7) An expression is an arithmetic expression, literal expression, or logical expression. An expression that obtains a numerical value as its evaluation result is called an arithmetic expression; the one that obtains a character string is called a character expression; and the one that obtains a logical value is called a logical expression. (8) When an expression is entered into a cell, it is evaluated immediately. When a cell value which an expression references changes, the expression is immediately and appropriately reevaluated. 4. Operators (1) The unary operators are the plus sign “+” and the minus sign“-”. (2) The arithmetic operators are add “+”, subtract “-”, multiply “*”, divide “/”, and exponentiation “^”. (3) The comparison operators are greater than “>”, less than “<”, equal to or greater than “≥”, equal to or less than “≤”, equal to “=”, and not equal to “≠”. (4) For parentheses, “ ( ” and “ ) ” are used. (5) If an expression contains multiple operations and parentheses, the order of operations follow the precedence in the table below. Type of operation             Operator        Precedence Parentheses               (      )                High Exponentiation            ^ Unary operations          +, - Multiplication/division   *, / Addition/subtraction      +, - Comparison operations >, <, ≥, ≤, =, ≠            Low 5. Copying of cells (1) A value or expression in a cell can be copied into the other cells. (2) In case of copying a cell, when an expression including a cell address has been entered into a source cell and the cell is copied to a destination cell so that the difference in addresses between the source and destination cells can be maintained by making the cell address change in the expression, this way of refefence is called relative reference. In this case, an expression, in which the differences in column and row numbers between the source and destination cells are added to the cell address in the expression in the source cell, is entered into the destination - iv - cell. [Example] When expression “A1+5” has been entered into cell A6 and this cell is copied to cell B8 , expression “B3+5” is entered into cell B8. (3) In case of copying a cell, when an expression including a cell address has been entered into a source cell and the cell is copied to a destination cell so that either or both of the column and row numbers of the cell address in the expression in the source cell can be maintained, this way of reference is called absolute reference. A “$” is placed immediately before either or both of the column and row numbers to which absolute reference is applied. [Example] When expression “$A$1+$A2+A$5” has been entered into cell B1 and this cell is copied to cell C4, expression “$A$1+$A5+B$5” is entered into cell C4 . (4) In case of copying a cell, when an expression referencing to another worksheet has been entered into a source cell and the cell is copied to a destination cell, the name of referencing worksheet is not changed in the destination cell. [Example] When expression “Sheet1!A1” has been entered into cell A6 in worksheet “Sheet2” and the cell is copied to cell B8 in worksheet “Sheet3”, expression “Sheet1!B3” is entered into cell B8 . 6. Functions The functions defined in the ects or costs are considered, and the result of calculation is\n   rounded off to one (1) decimal place.\n\n   a) 2.5                 b) 3.3                  c) 5.0                     d) 10.0\n                        Pseudo programming language notations\n\nIn algorithm and programming questions that use pseudo programming language, the following\nnotations are used unless otherwise stated:\n\n[Pseudo programming language notations]\n               Notation                                      Description\n○ procedure(type: arg1, ...)          Declares a procedure and its argument(s) arg1, ... .\n○ ret-type: function(type: arg1, ...) Declares a function, its argument(s) arg1, ... , and\n                                        type of return value ret-type.\n  type: var1, ...                       Declares variables var1, ... and arrays array1, ... by\n  type []: array1, ...                  data type such as integer, real, and string.\n  /* comment */                         Describes a comment between /* and */.\n  // comment                            Describes a comment after // till end of line.\n  variable ← expression                 Assigns the value of the expression to the variable.\n  procedure(arg1, ...)                  Calls a procedure by passing arguments arg1, ... .\n  function(arg1, ...)                   Calls a function by passing arguments arg1, ... ,\n                                        and receiving the return value.\n  output arg1, ...                      Outputs values of arg1, ... to a printing device.\n  return ret-val                        Finishes a function by passing back a return value\n                                        ret-val.\n  if (condition-i)                      Indicates the selection process.\n    process-i               *1          *1 If condition-i is true, then execute process-i.\n  elseif (condition-ei)                       Otherwise, proceed to the next elseif or\n    process-ei              *2          else , B, ..., Z, AA, AB, ..., AZ, BA, BB, ..., BZ, ..., IU, ...IV. For the row numbers, the topmost\n    number is 1 , and they are represented as 1, 2, ..., 10000 .\n (3) Multiple worksheets can be used. In this case, a unique name is to be given to each worksheet\n    so that they can be distinguished from the other worksheets.\n\n 2. Cells and cell ranges\n (1) Each grid that makes up a worksheet is called a cell. Its position is represented by the column\n    and row numbers, and this is called a cell address.\n   [Example] The cell address of the cell at column A row 1 is represented as A1 .\n (2) When a group of all cells in a rectangular area in a worksheet are to be handled together, the\n    group is represented by using the cell addresses of the cells at top left and bottom right in the\n    rectangle and “:” as “top left cell address:bottom right cell address”. This is called a cell range.\n   [Example] A cell range whose addresses at top left is A1 and bottom right is B3 is represented\n                as “A1:B3” .\n (3) If a cell address or a cell range in another worksheet is to be specified, the address is\n    represented by using the worksheet name and “ ! ” as “worksheet name!cell address” and\n    the range is represented as “worksheet name!cell range”.\n   [Example] If cells B5 to G10 in worksheet “Sheet1” are to be specified from another\n                worksheet, it is represented as “Sheet1!B5:G10” .\n\n 3. Values and expressions\n (1) A cell has a value, and the value can be referenced by the cell address. A cell value is a\n    numerical value, character string, logical value, or null value.\n (2) A character string is enclosed in single quotation marks “ ’ ”.\n   [Example] The character strings “ A ” and “ BC ” are expressed as ’A’ and ’BC’, respectively.\n (3) A logical value is represented as true or false.\n (4) A null value is represented as null, and a cell with a null value is called a blank cell. The\n    initial state of a cell is blank.\n (5) An expression can be entered into a cell. The cell has the value of evaluated result of the\n    expression.\n (6) An expression is composed of constants, cell addresses, operators, parentheses, and\n    functions. A constant is represented as a numerical value, character string, logical value, or\n  null value. A cell address in an expression references a value of the cell at that address.\n(7) An expression is an arithmetic expression, literal expression, or logical expression. An\n  expression that obtains a numerical value as its evaluation result is called an arithmetic\n  expression; the one that obtains a character string is called a character expression; and the\n  one that obtains a logical value is called a logical expression.\n(8) When an expression is entered into a cell, it is evaluated immediately. When a cell value\n  which an expression references changes, the expression is immediately and appropriately\n  reevaluated.\n\n4. Operators\n(1) The unary operators are the plus sign “+” and the minus sign“-”.\n(2) The arithmetic operators are add “+”, subtract “-”, multiply “*”, divide “/”, and\n  exponentiation “^”.\n(3) The comparison operators are greater than “>”, less than “<”, equal to or greater than “≥”,\n  equal to or less than “≤”, equal to “=”, and not equal to “≠”.\n(4) For parentheses, “ ( ” and “ ) ” are used.\n(5) If an expression contains multiple operations and parentheses, the order of operations\n  follows the precedence in the table below.\n\n          Type of operation          Operator        Precedence\n       Parentheses               (      )                High\n       Exponentiation            ^\n       Unary operations          +, -\n       Multiplication/division   *, /\n       Addition/subtraction      +, -\n       Comparison operations >, <, ≥, ≤, =, ≠            Low\n\n5. Copying of cells\n(1) A value or expression in a cell can be copied into the other cells.\n(2) In case of copying a cell, when an expression including a cell address has been entered into\n  a source cell and the cell is copied to a destination cell so that the difference in addresses\n  between the source and destination cells can be maintained by making the cell address change\n  in the expression, this way of reference is called relative reference. In this case, an expression,\n  in which the differences in column and row numbers between the source and destination cells\n  are added to the cell address in the expression in the source cell, is entered into the destination\n  cell.\n  [Example] When expression “A1+5” has been entered into cell A6 and this cell is copied to\n               cell B8 , expression “B3+5” is entered into cell B8.\n(3) In case of copying a cell, when an expression including a cell address has been entered into\n  a source cell and the cell is copied to a destination cell so that either or both of the column\n  and row numbers of the cell address in the expression in the source cell can be maintained,\n  this way of reference is called absolute reference. A “$” is placed immediately before either\n  or both of the column and row numbers to which absolute reference is applied.\n  [Example] When expression “$A$1+$A2+A$5” has been entered into cell B1 and this cell is\n              copied to cell C4, expression “$A$1+$A5+B$5” is entered into cell C4 .\n(4) In case of copying a cell, when an expression referencing to another worksheet has been\n  entered into a source cell and the cell is copied to a destination cell, the name of referencing\n  worksheet is not changed in the destination cell.\n  [Example] When expression “Sheet1!A1” has been entered into cell A6 in worksheet “Sheet2”\n              and the cell is copied to cell B8 in worksheet “Sheet3”, expression “Sheet1!B3”\n              is entered into cell B8 .\n\n6. Functions\nThe functions defined in the table below are available for use in an expression.\n      Format                                              Description\n
